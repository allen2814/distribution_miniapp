<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
  <script>
    var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
      CSS.supports('top: constant(a)'))
    document.write(
      '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
      (coverSupport ? ', viewport-fit=cover' : '') + '" />')
  </script>
  <title></title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

<script>
  // 检查是否在Flutter WebView环境中
  function isInFlutterWebView() {
    return window.BunnyuFlutterChannel !== undefined;
  }

  // 发送消息到Flutter
  function sendToFlutter(action, params = {}) {
    if (isInFlutterWebView()) {
      window.BunnyuFlutterChannel.postMessage(
        JSON.stringify({
          action: action,
          params: params,
        }),
      );
    } else {
      console.log('Not in Flutter WebView');
    }
  }

  // 示例：导航到指定页面
  function navigateToPage(route, params = {}) {
    sendToFlutter('navigate', {
      route: route,
      arguments: params,
    });
  }

  // 示例：返回首页
  function backToHome() {
    sendToFlutter('backToHome');
  }
</script>
